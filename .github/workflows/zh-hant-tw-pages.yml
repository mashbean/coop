name: Publish zh-Hant-TW documentation

on:
  push:
    branches:
      - codex/zh-hant-tw-foundation
    paths:
      - localization/zh-Hant-TW/**
      - .github/workflows/zh-hant-tw-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zh-hant-tw-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.2
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install mdBook
        run: |
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location \
            --output mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${archive}"
          mkdir mdbook-bin
          tar -xzf mdbook.tar.gz -C mdbook-bin

      - name: Build and validate the Traditional Chinese site
        env:
          MDBOOK_BIN: ${{ github.workspace }}/mdbook-bin/mdbook
        run: ./localization/zh-Hant-TW/scripts/check-all.sh

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: localization/zh-Hant-TW/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
